name: Escaneo de secretos

# Revisa cada push y cada PR en busca de contraseñas, claves de API o
# tokens expuestos por error, antes de que lleguen a main.
on:
  push:
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Escanear con Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
